<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VERTEX // COFFRE_VIRTUEL</title>
    <style>
        :root {
            --bg-color: #0b0c10;
            --accent-color: #ff6b00;
            --text-bright: #ffffff;
            --text-muted: #858585;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-bright);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 15px;
        }

        .phone-container {
            width: 100%;
            max-width: 400px;
            background-color: #12161f;
            border: 1px solid #232936;
            border-top: 4px solid var(--accent-color);
            padding: 25px 20px;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
        }

        .header {
            margin-bottom: 25px;
            border-bottom: 1px dashed #232936;
            padding-bottom: 15px;
        }

        .header h1 {
            font-size: 1.3rem;
            letter-spacing: 2px;
        }

        .header h1 span {
            color: var(--accent-color);
        }

        .section {
            margin-bottom: 25px;
        }

        .section-title {
            font-size: 0.75rem;
            color: var(--accent-color);
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 15px;
            font-weight: bold;
        }

        /* LISTE DES ITEMS */
        .item-slot {
            background-color: #171d26;
            border: 1px solid #232936;
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .item-name {
            font-size: 0.9rem;
            font-weight: bold;
        }

        .item-type {
            font-size: 0.7rem;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-top: 3px;
        }

        .item-status {
            font-size: 0.8rem;
            color: #00ff66; /* Vert pour indiquer disponible à l'armurerie */
        }

        .slot-empty {
            border: 1px dashed #232936;
            background-color: transparent;
            color: var(--text-muted);
            justify-content: center;
            font-size: 0.8rem;
            letter-spacing: 1px;
        }

        /* BOUTON DE NAVIGATION */
        .nav-btn {
            display: block;
            width: 100%;
            background-color: transparent;
            border: 1px solid var(--accent-color);
            color: var(--accent-color);
            padding: 12px;
            text-align: center;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
            border-radius: 4px;
            transition: all 0.2s ease;
            margin-top: 30px;
        }

        .nav-btn:hover {
            background-color: var(--accent-color);
            color: #12161f;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="phone-container">
        
        <div class="header">
            <h1>Coffre <span>Virtuel</span></h1>
        </div>

        <div class="section">
            <div class="section-title">Équipement Enregistré (2/6)</div>
            
            <div class="item-slot">
                <div>
                    <div class="item-name">Fusil d'assaut "Viper-4"</div>
                    <div class="item-type">Arme Principale // Boucle Orange</div>
                </div>
                <div class="item-status">STOCKÉ</div>
            </div>

            <div class="item-slot">
                <div>
                    <div class="item-name">Module Holo-Sight X2</div>
                    <div class="item-type">Accessoire Arme</div>
                </div>
                <div class="item-status">STOCKÉ</div>
            </div>

            <div class="item-slot slot-empty">
                [ EMPLACEMENT VIDE ]
            </div>
            <div class="item-slot slot-empty">
                [ EMPLACEMENT VIDE ]
            </div>
        </div>

        <a href="index.html" class="nav-btn">⬅ Retour au Profil</a>

    </div>

</body>
</html>
