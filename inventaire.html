<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VERTEX // PROTOCOLE_COFFRE</title>
    <style>
        :root {
            --bg-color: #050505;
            --panel-bg: #0b0b0d;
            --panel-border: #141417;
            --accent-orange: #FF8F00;
            --text-bright: #ffffff;
            --text-muted: #FFC107;
            --font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--font-family);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-bright);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 15px;
        }

        .phone-container {
            width: 100%;
            max-width: 400px;
            background-color: var(--panel-bg);
            border: 1px solid var(--panel-border);
            padding: 30px 20px;
            border-radius: 12px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
        }

        .header-box {
            border: 1px solid var(--panel-border);
            background-color: rgba(20, 20, 23, 0.4);
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 30px;
        }

        .header-box .sub {
            font-size: 0.65rem;
            color: var(--text-muted);
            letter-spacing: 3px;
            font-weight: bold;
            margin-bottom: 4px;
            text-transform: uppercase;
        }

        .header-box h1 {
            font-size: 1.3rem;
            font-weight: 900;
            letter-spacing: 2px;
        }

        .section-title {
            font-size: 0.7rem;
            color: var(--text-muted);
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 15px;
            font-weight: bold;
            text-align: center;
        }

        /* CASIERS / EMPLACEMENTS VIRTUALISÉS */
        .item-row {
            background-color: rgba(20, 20, 23, 0.3);
            border: 1px solid var(--panel-border);
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .item-details .name {
            font-size: 0.9rem;
            font-weight: bold;
            margin-bottom: 2px;
        }

        .item-details .type {
            font-size: 0.7rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .item-status {
            font-size: 0.65rem;
            font-weight: bold;
            color: #00ff66;
            border: 1px solid rgba(0, 255, 102, 0.2);
            padding: 4px 8px;
            border-radius: 4px;
            background-color: rgba(0, 255, 102, 0.05);
            letter-spacing: 1px;
        }

        .slot-empty {
            border: 1px dashed var(--panel-border);
            background-color: transparent;
            justify-content: center;
            color: var(--text-muted);
            font-size: 0.75rem;
            letter-spacing: 1px;
            padding: 20px;
        }

        /* BOUTON RETOUR RE-STYLISE */
        .back-button {
            display: block;
            width: 100%;
            background-color: var(--panel-border);
            border: 1px solid var(--panel-border);
            color: var(--text-bright);
            padding: 14px;
            text-align: center;
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
            border-radius: 6px;
            transition: all 0.2s ease;
            margin-top: 30px;
        }

        .back-button:hover {
            border-color: var(--text-muted);
            background-color: transparent;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="phone-container">
        
        <div class="header-box">
            <div class="sub">Armurerie Dématérialisée</div>
            <h1>COFFRE VIRTUEL</h1>
        </div>

        <div class="section-title">• Arsenal Enregistré (2/6) •</div>

        <div class="item-row">
            <div class="item-details">
                <div class="name">Fusil d'assaut "Viper-4"</div>
                <div class="type">Arme principale // Boucle Orange</div>
            </div>
            <div class="item-status">SÉCURISÉ</div>
        </div>

        <div class="item-row">
            <div class="item-details">
                <div class="name">Viseur Holo-Sight X2</div>
                <div class="type">Accessoire Tactique</div>
            </div>
            <div class="item-status">SÉCURISÉ</div>
        </div>

        <div class="item-row slot-empty">
            [ EMPLACEMENT DISPONIBLE ]
        </div>
        <div class="item-row slot-empty">
            [ EMPLACEMENT DISPONIBLE ]
        </div>

        <a href="index.html" class="back-button">🡴 Retour au Profil</a>

    </div>

</body>
</html>
