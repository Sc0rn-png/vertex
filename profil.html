<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VERTEX // PROTOCOLE_PROFIL</title>
    <style>
        /* HIÉRARCHIE DES COULEURS ÉPURÉE */
        :root {
            --bg-color: #050505;
            --panel-bg: #0b0b0d;
            --panel-border: #141417;
            
            /* Ta couleur accentuation principale */
            --accent-gold: #ffb800; 
            
            /* Couleurs de texte pour l'équilibre visuel */
            --text-bright: #ffffff;      /* Pour les chiffres principaux et grands titres */
            --text-normal: #e0e0e6;      /* Pour le texte standard */
            --text-muted: #55555a;       /* Pour TOUS les petits labels secondaires */
            --font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--font-family);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-normal);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 15px;
        }

        .phone-container {
            width: 100%;
            max-width: 400px;
            background-color: var(--panel-bg);
            border: 1px solid var(--panel-border);
            padding: 30px 20px;
            border-radius: 12px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
        }

        /* ENTÊTE ID */
        .header-box {
            border: 1px solid var(--panel-border);
            background-color: rgba(20, 20, 23, 0.4);
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 25px;
        }

        .header-box .sub {
            font-size: 0.65rem;
            color: var(--text-muted);
            letter-spacing: 3px;
            font-weight: bold;
            margin-bottom: 4px;
            text-transform: uppercase;
        }

        .header-box h1 {
            font-size: 1.4rem;
            font-weight: 900;
            letter-spacing: 2px;
            color: var(--accent-gold);
        }

        .meta-line {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-align: center;
            margin-top: -15px;
            margin-bottom: 30px;
            letter-spacing: 1px;
        }

        /* GRANDE VALEUR (CRÉDITS) */
        .solde-box {
            text-align: center;
            margin-bottom: 30px;
        }

        .solde-box .amount {
            font-size: 2.4rem;
            font-weight: 800;
            color: var(--text-bright);
        }

        .solde-box .label {
            font-size: 0.65rem;
            color: var(--accent-gold);
            letter-spacing: 2px;
            margin-top: 2px;
            font-weight: bold;
            text-transform: uppercase;
        }

        /* BARRE DE PROGRESSION */
        .progress-container {
            background-color: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--panel-border);
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 30px;
        }

        .progress-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.7rem;
            margin-bottom: 8px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .progress-label .title {
            color: var(--text-muted);
        }

        .progress-label .value {
            color: var(--text-bright);
        }
